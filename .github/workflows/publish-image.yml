name: Build and publish PhotoCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream PhotoCraft release tag (leave empty to use the latest release)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild and update the MikaPST release even if it already exists"
        required: false
        default: false
        type: boolean

  schedule:
    # Check weekly for a new official PhotoCraft release.
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Resolve upstream PhotoCraft release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requestedTag = (process.env.REQUESTED_UPSTREAM_TAG || "").trim();

            let release;
            if (requestedTag) {
              const response = await github.rest.repos.getReleaseByTag({
                owner: "storytold",
                repo: "photocraft",
                tag: requestedTag
              });
              release = response.data;
            } else {
              const response = await github.rest.repos.getLatestRelease({
                owner: "storytold",
                repo: "photocraft"
              });
              release = response.data;
            }

            if (!release.tag_name) {
              throw new Error("The upstream release does not contain a tag_name.");
            }

            core.info(`Selected upstream release: ${release.tag_name}`);
            core.setOutput("tag", release.tag_name);
            core.setOutput("name", release.name || `PhotoCraft ${release.tag_name}`);
            core.setOutput("url", release.html_url);
            core.setOutput("body", release.body || "");
            core.setOutput("prerelease", String(release.prerelease));
            core.setOutput("published_at", release.published_at || "");

      - name: Check whether this release was already published
        id: release-check
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const tag = process.env.UPSTREAM_TAG;
            let existing = false;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              existing = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // A push to the packaging workflow should rebuild the current
            // upstream release. Scheduled/manual runs remain idempotent.
            const force = process.env.FORCE_REBUILD === "true" ||
                          process.env.EVENT_NAME === "push";
            const skip = existing && !force;

            core.info(
              skip
                ? `Release ${tag} already exists in this repository; nothing to do.`
                : `Release ${tag} will be built and published.`
            );
            core.setOutput("skip", String(skip));

      - name: Checkout official PhotoCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: photocraft-src

      - name: Set lowercase image name
        if: steps.release-check.outputs.skip != 'true'
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/photocraft-web" >> "$GITHUB_OUTPUT"

      - name: Extract upstream commit
        if: steps.release-check.outputs.skip != 'true'
        id: upstream
        shell: bash
        run: |
          echo "sha=$(git -C photocraft-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./photocraft-src
          file: ./photocraft-src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.upstream-release.outputs.tag }}
            ${{ steps.image.outputs.name }}:upstream-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.title=PhotoCraft Web
            org.opencontainers.image.description=Community-maintained WebAssembly build of PhotoCraft
            org.opencontainers.image.source=https://github.com/storytold/photocraft
            org.opencontainers.image.version=${{ steps.upstream-release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update MikaPST GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.upstream-release.outputs.name }}
          UPSTREAM_URL: ${{ steps.upstream-release.outputs.url }}
          UPSTREAM_BODY: ${{ steps.upstream-release.outputs.body }}
          UPSTREAM_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          UPSTREAM_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.UPSTREAM_TAG;
            const image = process.env.IMAGE_NAME;
            const upstreamNotes = (process.env.UPSTREAM_BODY || "").trim();
            const digest = process.env.IMAGE_DIGEST || "not reported";

            const body = [
              `This release packages **${process.env.UPSTREAM_NAME}** as a self-hosted Docker image.`,
              "",
              "## Docker image",
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHA}\``,
              "",
              "Supported platforms: \`linux/amd64\`, \`linux/arm64\`.",
              "",
              "## Upstream project",
              `- **Official release:** [${process.env.UPSTREAM_NAME}](${process.env.UPSTREAM_URL})`,
              `- **Upstream tag:** \`${tag}\``,
              `- **Upstream commit:** \`${process.env.UPSTREAM_SHA}\``,
              `- **Published upstream:** ${process.env.UPSTREAM_PUBLISHED_AT || "not specified"}`,
              "",
              "## Upstream release notes",
              upstreamNotes || "The upstream release does not provide release notes.",
              "",
              "## Image details",
              `- **Image digest:** \`${digest}\``,
              "- **Packaging:** community-maintained by MikaPST; not an official PhotoCraft release.",
              "- **Build source:** the official PhotoCraft source at the upstream release tag above."
            ].join("\n");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = `PhotoCraft Web ${tag}`;
            let existingRelease = null;

            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              });
              existingRelease = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const prerelease = process.env.UPSTREAM_PRERELEASE === "true";

            if (existingRelease) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existingRelease.id,
                tag_name: tag,
                name,
                body,
                draft: false,
                prerelease
              });
              core.info(`Updated existing MikaPST release ${tag}.`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name,
                body,
                draft: false,
                prerelease
              });
              core.info(`Created MikaPST release ${tag}.`);
            }
