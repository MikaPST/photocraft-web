name: Build and publish PhotoCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official PhotoCraft release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"

permissions:
  contents: write
  packages: write

concurrency:
  group: photocraft-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Resolve official PhotoCraft release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const tag = (process.env.REQUESTED_UPSTREAM_TAG || "").trim();
            const params = { owner: "storytold", repo: "photocraft" };
            const { data: release } = tag
              ? await github.rest.repos.getReleaseByTag({ ...params, tag })
              : await github.rest.repos.getLatestRelease(params);
            if (!release.tag_name) throw new Error("Upstream release has no tag");
            core.setOutput("tag", release.tag_name);
            core.setOutput("name", release.name || `PhotoCraft ${release.tag_name}`);
            core.setOutput("url", release.html_url);
            core.setOutput("prerelease", String(release.prerelease));
            core.setOutput("published_at", release.published_at || "");

      - name: Check existing MikaPST release
        id: release-check
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            let existing = false;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo,
                tag: process.env.UPSTREAM_TAG
              });
              existing = true;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const force = process.env.FORCE_REBUILD === "true" ||
                          process.env.EVENT_NAME === "push";
            core.setOutput("skip", String(existing && !force));

      - name: Checkout official PhotoCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: photocraft-src

      - name: Validate source and install versioned packaging configuration
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f photocraft-src/Cargo.toml
          test -f photocraft-src/craft-i18n.rev
          test -f photocraft-src/apps/photocraft-web/Trunk.toml
          test -f photocraft-src/LICENSE-MIT
          test -f photocraft-src/LICENSE-APACHE
          test -f photocraft-src/NOTICE
          test -f photocraft-src/ATTRIBUTION.md
          test -d photocraft-src/assets/fonts
          test -d photocraft-src/assets/icons
          test -d photocraft-src/assets/dict
          mkdir -p photocraft-src/packaging/web
          cp nginx.conf photocraft-src/packaging/web/nginx.conf
          cp .dockerignore photocraft-src/.dockerignore
          echo "Using versioned Dockerfile, NGINX config and .dockerignore from this repository."

      - name: Extract upstream commit
        if: steps.release-check.outputs.skip != 'true'
        id: upstream
        shell: bash
        run: echo "sha=$(git -C photocraft-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set lowercase image name
        if: steps.release-check.outputs.skip != 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/photocraft-web" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./photocraft-src
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHOTOCRAFT_BUILD_SHA=${{ steps.upstream.outputs.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.upstream-release.outputs.tag }}
            ${{ steps.image.outputs.name }}:upstream-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.title=PhotoCraft Web
            org.opencontainers.image.description=Community-maintained WebAssembly build of PhotoCraft
            org.opencontainers.image.source=https://github.com/storytold/photocraft
            org.opencontainers.image.version=${{ steps.upstream-release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update MikaPST GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.upstream-release.outputs.name }}
          UPSTREAM_URL: ${{ steps.upstream-release.outputs.url }}
          UPSTREAM_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          UPSTREAM_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const tag = process.env.UPSTREAM_TAG;
            const { data: upstream } = await github.rest.repos.getReleaseByTag({
              owner: "storytold", repo: "photocraft", tag
            });
            const image = process.env.IMAGE_NAME;
            const body = [
              `This release packages **${process.env.UPSTREAM_NAME}** as a self-hosted Docker image.`,
              "", "## Docker image",
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHA}\``,
              "", "Supported platforms: `linux/amd64`, `linux/arm64`.",
              "", "## Upstream project",
              `- **Official release:** [${process.env.UPSTREAM_NAME}](${process.env.UPSTREAM_URL})`,
              `- **Upstream tag:** \`${tag}\``,
              `- **Upstream commit:** \`${process.env.UPSTREAM_SHA}\``,
              `- **Published upstream:** ${process.env.UPSTREAM_PUBLISHED_AT || "not specified"}`,
              "", "## Upstream release notes",
              upstream.body || "No release notes provided.",
              "", "## Image details",
              `- **Image digest:** \`${process.env.IMAGE_DIGEST}\``,
              "- **Packaging:** community-maintained by MikaPST; not an official PhotoCraft release.",
              "- **Build source:** official PhotoCraft source at the selected upstream release tag.",
              "- **Build configuration:** versioned Dockerfile and nginx.conf in MikaPST/photocraft-web."
            ].join("\n");
            let existing;
            try {
              ({ data: existing } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (e) { if (e.status !== 404) throw e; }
            const args = {
              owner, repo, tag_name: tag, name: `PhotoCraft Web ${tag}`,
              body, draft: false, prerelease: process.env.UPSTREAM_PRERELEASE === "true"
            };
            if (existing) {
              await github.rest.repos.updateRelease({ ...args, release_id: existing.id });
            } else {
              await github.rest.repos.createRelease({ ...args, target_commitish: context.sha });
            }
