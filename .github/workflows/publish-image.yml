name: Build and publish PhotoCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official PhotoCraft release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"

permissions:
  contents: write
  packages: write

concurrency:
  group: photocraft-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # --------------------------------------------------
      # 1. Checkout packaging repository
      # --------------------------------------------------

      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Validate packaging files
        shell: bash
        run: |
          set -euo pipefail

          test -f packaging/Dockerfile
          test -f packaging/nginx.conf
          test -f packaging/.dockerignore

          echo "Packaging files validated successfully."
          ls -la packaging/

      # --------------------------------------------------
      # 2. Resolve upstream release
      # --------------------------------------------------

      - name: Resolve official PhotoCraft release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const tag = (process.env.REQUESTED_UPSTREAM_TAG || "").trim();
            const params = {
              owner: "storytold",
              repo: "photocraft"
            };

            const { data: release } = tag
              ? await github.rest.repos.getReleaseByTag({
                  ...params,
                  tag
                })
              : await github.rest.repos.getLatestRelease(params);

            if (!release.tag_name) {
              throw new Error("Upstream release has no tag");
            }

            core.setOutput("tag", release.tag_name);
            core.setOutput(
              "name",
              release.name || `PhotoCraft ${release.tag_name}`
            );
            core.setOutput("url", release.html_url);
            core.setOutput(
              "prerelease",
              String(release.prerelease)
            );
            core.setOutput(
              "published_at",
              release.published_at || ""
            );

      # --------------------------------------------------
      # 3. Check existing release
      # --------------------------------------------------

      - name: Check existing MikaPST release
        id: release-check
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            let existing = false;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.UPSTREAM_TAG
              });
              existing = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const force =
              process.env.FORCE_REBUILD === "true" ||
              process.env.EVENT_NAME === "push";

            core.setOutput(
              "skip",
              String(existing && !force)
            );

      # --------------------------------------------------
      # 4. Checkout official PhotoCraft source
      # --------------------------------------------------

      - name: Checkout official PhotoCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: photocraft-src
          fetch-depth: 1

      # --------------------------------------------------
      # 5. Validate upstream source
      # --------------------------------------------------

      - name: Validate upstream PhotoCraft source
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f photocraft-src/Cargo.toml
          test -f photocraft-src/craft-i18n.rev
          test -f photocraft-src/apps/photocraft-web/Trunk.toml

          test -f photocraft-src/LICENSE-MIT
          test -f photocraft-src/LICENSE-APACHE
          test -f photocraft-src/NOTICE
          test -f photocraft-src/ATTRIBUTION.md

          test -d photocraft-src/assets/fonts
          test -d photocraft-src/assets/icons
          test -d photocraft-src/assets/dict

          echo "Official PhotoCraft source validated."

      # --------------------------------------------------
      # 6. Install versioned packaging configuration
      # --------------------------------------------------

      - name: Install versioned packaging configuration
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p photocraft-src/packaging/web

          cp packaging/nginx.conf \
             photocraft-src/packaging/web/nginx.conf

          cp packaging/.dockerignore \
             photocraft-src/.dockerignore

          test -f photocraft-src/packaging/web/nginx.conf
          test -f photocraft-src/.dockerignore

          echo "Versioned packaging configuration installed."
          echo "Dockerfile: packaging/Dockerfile"
          echo "Build context: photocraft-src/"
          echo "NGINX config: photocraft-src/packaging/web/nginx.conf"

      # --------------------------------------------------
      # 7. Extract upstream commit
      # --------------------------------------------------

      - name: Extract upstream commit
        if: steps.release-check.outputs.skip != 'true'
        id: upstream
        shell: bash
        run: |
          echo "sha=$(git -C photocraft-src rev-parse --short=12 HEAD)" \
            >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 8. Resolve GHCR image name
      # --------------------------------------------------

      - name: Set lowercase image name
        if: steps.release-check.outputs.skip != 'true'
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/photocraft-web" \
            >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 9. Docker multi-platform setup
      # --------------------------------------------------

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 10. GHCR authentication
      # --------------------------------------------------

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 11. Build and publish Docker image
      # --------------------------------------------------

      - name: Build and publish multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./photocraft-src
          file: ./packaging/Dockerfile

          platforms: linux/amd64,linux/arm64
          push: true

          build-args: |
            PHOTOCRAFT_BUILD_SHA=${{ steps.upstream.outputs.sha }}

          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.upstream-release.outputs.tag }}
            ${{ steps.image.outputs.name }}:upstream-${{ steps.upstream.outputs.sha }}

          labels: |
            org.opencontainers.image.title=PhotoCraft Web
            org.opencontainers.image.description=Community-maintained WebAssembly build of PhotoCraft
            org.opencontainers.image.source=https://github.com/storytold/photocraft
            org.opencontainers.image.version=${{ steps.upstream-release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # 12. Create or update GitHub Release
      # --------------------------------------------------

      - name: Create or update MikaPST GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.upstream-release.outputs.name }}
          UPSTREAM_URL: ${{ steps.upstream-release.outputs.url }}
          UPSTREAM_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          UPSTREAM_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.UPSTREAM_TAG;

            const { data: upstream } =
              await github.rest.repos.getReleaseByTag({
                owner: "storytold",
                repo: "photocraft",
                tag
              });

            const image = process.env.IMAGE_NAME;

            const body = [
              `This release packages **${process.env.UPSTREAM_NAME}** as a self-hosted Docker image.`,
              "",
              "## Docker image",
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHA}\``,
              "",
              "Supported platforms: `linux/amd64`, `linux/arm64`.",
              "",
              "## Upstream project",
              `- **Official release:** [${process.env.UPSTREAM_NAME}](${process.env.UPSTREAM_URL})`,
              `- **Upstream tag:** \`${tag}\``,
              `- **Upstream commit:** \`${process.env.UPSTREAM_SHA}\``,
              `- **Published upstream:** ${process.env.UPSTREAM_PUBLISHED_AT || "not specified"}`,
              "",
              "## Upstream release notes",
              upstream.body || "No release notes provided.",
              "",
              "## Image details",
              `- **Image digest:** \`${process.env.IMAGE_DIGEST}\``,
              "- **Packaging:** community-maintained by MikaPST; not an official PhotoCraft release.",
              "- **Build source:** official PhotoCraft source at the selected upstream release tag.",
              "- **Build configuration:** versioned Dockerfile, nginx.conf and .dockerignore in MikaPST/photocraft-web."
            ].join("\n");

            let existing;

            try {
              ({ data: existing } =
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag
                }));
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const args = {
              owner,
              repo,
              tag_name: tag,
              name: `PhotoCraft Web ${tag}`,
              body,
              draft: false,
              prerelease:
                process.env.UPSTREAM_PRERELEASE === "true"
            };

            if (existing) {
              await github.rest.repos.updateRelease({
                ...args,
                release_id: existing.id
              });
            } else {
              await github.rest.repos.createRelease({
                ...args,
                target_commitish: context.sha
              });
            }
